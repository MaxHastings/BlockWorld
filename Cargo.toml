[package]
name = "blockworld"
version = "0.1.0"
edition = "2021"

[dependencies]
bytemuck = { version = "1.21", features = ["derive"] }
glam = "0.29"
image = { version = "0.25", default-features = false, features = ["png"] }
noise = "0.9"
pollster = "0.4"
wgpu = "24"
winit = { version = "0.30", features = ["rwh_06"] }

[dev-dependencies]
naga = { version = "24", features = ["wgsl-in"] }

[profile.release]
opt-level = 3
lto = "thin"
